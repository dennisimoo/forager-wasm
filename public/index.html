<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Forager 4.1.9</title>
  <style>
    html,
    body {
      margin: 0;
      background: #10121c;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
    }
    canvas {
      display: block;
      width: min(100vw, calc(100vh * var(--aspect, 1.777778)));
      height: auto;
      image-rendering: pixelated;
    }
    #fullscreen {
      position: fixed;
      right: 108px;
      bottom: 12px;
      padding: 6px 12px;
      border: 1px solid #fff8;
      background: #10121ccc;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
  <canvas id="game" width="1920" height="1080"></canvas>
  <button
    id="fullscreen"
    type="button"
    title="Toggle fullscreen"
    aria-label="Toggle fullscreen"
  >
    ⛶
  </button>
  <script type="module">
    import { attachGameInput } from "./browser-input.mjs";
    document
      .getElementById("fullscreen")
      .addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (error) {
          console.error("Fullscreen", error);
        }
      });
    const events = [];
    window.foragerDiagnostic = { events, status: "starting" };
    const audioContext = new AudioContext({ latencyHint: "interactive" });
    window.foragerDiagnostic.audioContext = audioContext;
    const resumeAudio = () =>
      audioContext
        .resume()
        .catch((error) => console.error("Audio output", error));
    window.addEventListener("pointerdown", resumeAudio);
    window.addEventListener("keydown", resumeAudio);
    const worker = new Worker("./browser-wasi-worker.mjs", { type: "module" });
    window.foragerDiagnostic.worker = worker;
    window.addEventListener("pagehide", () => worker.terminate());
    const audioStreams = new Map();
    let nextAudioGeneration = 0;
    window.foragerDiagnostic.audioStreams = audioStreams;
    function padding(stream) {
      return stream.queue.reduce(
        (sum, entry) =>
          sum +
          (entry.source
            ? Math.min(
                entry.buffer.length,
                Math.max(
                  0,
                  Math.ceil(
                    (entry.end - audioContext.currentTime) *
                      stream.format.sampleRate,
                  ),
                ),
              )
            : entry.buffer.length),
        0,
      );
    }
    function consumed(stream) {
      return stream.submitted - padding(stream);
    }
    function reportAudioProgress(stream) {
      worker.postMessage({
        type: "audio-progress",
        client: stream.client,
        generation: stream.generation,
        consumed: consumed(stream),
      });
    }
    function schedule(stream) {
      for (const entry of stream.queue) {
        if (entry.source) continue;
        const source = audioContext.createBufferSource();
        source.buffer = entry.buffer;
        source.connect(stream.gain);
        entry.source = source;
        entry.start = Math.max(audioContext.currentTime, stream.end ?? 0);
        entry.end = entry.start + entry.buffer.duration;
        stream.end = entry.end;
        source.onended = () => {
          source.disconnect();
          const index = stream.queue.indexOf(entry);
          if (index >= 0) stream.queue.splice(index, 1);
          reportAudioProgress(stream);
          if (stream.started && stream.eventHandle)
            worker.postMessage({
              type: "audio-event",
              handle: stream.eventHandle,
            });
        };
        source.start(entry.start);
      }
    }
    worker.onmessage = ({ data }) => {
      if (data.type === "audio-request") {
        try {
          if (data.operation === "padding") {
            const stream = audioStreams.get(data.detail.client);
            if (!stream) throw new Error("Audio stream is not initialized");
            const frames = padding(stream);
            worker.postMessage({
              type: "audio-reply",
              id: data.id,
              result: frames,
            });
            return;
          }
          if (data.operation === "submit") {
            const stream = audioStreams.get(data.detail.client);
            if (!stream) throw new Error("Audio stream is not initialized");
            const { frames, samples } = data.detail;
            if (frames > stream.frames - padding(stream)) {
              throw new Error(
                "Audio submission exceeds the initialized buffer capacity",
              );
            }
            const buffer = audioContext.createBuffer(
              stream.format.channels,
              frames,
              stream.format.sampleRate,
            );
            for (let channel = 0; channel < stream.format.channels; channel++) {
              const output = buffer.getChannelData(channel);
              for (let frame = 0; frame < frames; frame++)
                output[frame] =
                  samples[frame * stream.format.channels + channel];
            }
            stream.queue.push({ buffer });
            stream.submitted += frames;
            if (stream.started) schedule(stream);
            worker.postMessage({
              type: "audio-reply",
              id: data.id,
              result: consumed(stream),
            });
            return;
          }
          if (data.operation === "dispose") {
            const stream = audioStreams.get(data.detail.client);
            if (!stream) throw new Error("Audio stream is not initialized");
            stream.started = false;
            clearInterval(stream.refillTimer);
            for (const entry of stream.queue)
              if (entry.source) {
                entry.source.onended = null;
                entry.source.stop();
                entry.source.disconnect();
              }
            stream.gain.disconnect();
            audioStreams.delete(data.detail.client);
            worker.postMessage({
              type: "audio-reply",
              id: data.id,
              result: null,
            });
            return;
          }
          if (data.operation === "set-event") {
            const stream = audioStreams.get(data.detail.client);
            if (!stream) throw new Error("Audio stream is not initialized");
            stream.eventHandle = data.detail.handle;
            worker.postMessage({
              type: "audio-reply",
              id: data.id,
              result: null,
            });
            return;
          }
          if (data.operation === "start") {
            const stream = audioStreams.get(data.detail.client);
            if (!stream) throw new Error("Audio stream is not initialized");
            if (stream.started)
              throw new Error("Audio stream is already started");
            stream.started = true;
            schedule(stream);
            // Refill before sources end. Native continuations can stall for
            // hundreds of milliseconds, so completion-only wakeups underrun.
            stream.refillTimer = setInterval(() => {
              reportAudioProgress(stream);
              if (stream.eventHandle && padding(stream) < stream.frames)
                worker.postMessage({
                  type: "audio-event",
                  handle: stream.eventHandle,
                });
            }, 20);
            worker.postMessage({
              type: "audio-reply",
              id: data.id,
              result: null,
            });
            return;
          }
          if (data.operation !== "initialize")
            throw new Error(`Unsupported audio operation ${data.operation}`);
          const { client, format } = data.detail;
          // Shared-mode capacity may exceed the requested duration. Keep half a
          // second available to cover measured 409 ms native scheduling stalls.
          const frames = Math.max(
            data.detail.frames,
            Math.ceil(format.sampleRate / 2),
          );
          if (audioStreams.has(client))
            throw new Error("Audio stream is already initialized");
          if (audioContext.state === "closed")
            throw new Error("Browser audio output is closed");
          const buffer = audioContext.createBuffer(
            format.channels,
            frames,
            format.sampleRate,
          );
          const gain = audioContext.createGain();
          gain.connect(audioContext.destination);
          const generation = ++nextAudioGeneration;
          audioStreams.set(client, {
            client,
            generation,
            submitted: 0,
            buffer,
            gain,
            format,
            frames,
            queue: [],
          });
          worker.postMessage({
            type: "audio-reply",
            id: data.id,
            result: { frames, generation },
          });
        } catch (error) {
          worker.postMessage({
            type: "audio-reply",
            id: data.id,
            error: String(error.message ?? error),
          });
        }
        return;
      }
      if (data.type === "runtime-state") {
        window.foragerDiagnostic.runtime = data.detail;
        return;
      }
      if (data.type === "frame") {
        const canvas = document.getElementById("game");
        canvas.style.setProperty(
          "--aspect",
          data.detail.width / data.detail.height,
        );
        window.foragerDiagnostic.frames =
          (window.foragerDiagnostic.frames ?? 0) + 1;
        return;
      }
      events.push(data);
      if (data.type === "error" || window.foragerDiagnostic.status !== "error")
        window.foragerDiagnostic.status = data.type;
      console.log("Forager diagnostic", data);
    };
    worker.onerror = (error) => {
      const detail = {
        message: error.message,
        file: error.filename,
        line: error.lineno,
      };
      events.push({ type: "error", detail });
      window.foragerDiagnostic.status = "error";
      console.error("Forager worker", detail);
    };
    const canvas = document.getElementById("game");
    attachGameInput(canvas, worker);
    const renderer = canvas.transferControlToOffscreen();
    worker.postMessage(
      {
        type: "init",
        width: canvas.width,
        height: canvas.height,
        canvas: renderer,
        audio: {
          sampleRate: audioContext.sampleRate,
          channels: audioContext.destination.channelCount,
          baseLatency: audioContext.baseLatency,
        },
      },
      [renderer],
    );
  </script>
</html>
